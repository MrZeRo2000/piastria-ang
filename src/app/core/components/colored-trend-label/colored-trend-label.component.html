@let v = value();
@if (v !== null && v !== undefined) {
  <span
    class="trend"
    [class.trend-up]="v > 0"
    [class.trend-down]="v < 0"
    >
    @if (v > 0) {
      <mat-icon>arrow_drop_up</mat-icon>
    }
    @if (v < 0) {
      <mat-icon>arrow_drop_down</mat-icon>
    }
    @if (v === 0) {
      <mat-icon>remove</mat-icon>
    }
  </span>
}
