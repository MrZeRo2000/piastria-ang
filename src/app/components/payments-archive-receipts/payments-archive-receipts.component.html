@let loading = archiveLoadingSignal();
<h2 mat-dialog-title>Archive receipts</h2>
<mat-dialog-content>
  <mat-list>
    @for (fileItem of files; track fileItem) {
      <mat-list-item>
          <span class="row">
            <span class=name-cell>
              {{fileItem.fileName}}
            </span>
            <span class="datetime-cell">
              {{fileItem.modifiedDate | date:'dd.MM.yyyy HH:mm'}}
            </span>
          </span>
      </mat-list-item>
    }
  </mat-list>
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton="filled" class="confirm-button" (click)="archiveOnClick()" [disabled]="loading">Archive</button>
  <button matButton mat-dialog-close>Close</button>
</mat-dialog-actions>
