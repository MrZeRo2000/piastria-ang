<div class="app-title-medium app-info">Version: {{version}}
  @if (versionStatus(); as status) {
    <mat-chip
      class="version-chip"
      [ngClass]="{'version-chip-warning': status.minorDifference, 'version-chip-error': status.majorDifference}">
      {{status.backendVersion}}
    </mat-chip>
  } @else {
    <mat-chip
      class="version-chip">
      ...
    </mat-chip>
  }
</div>
