@if (errorMessage) {
  <div class="container">
    <mat-card appearance="outlined" class="error-card">
      <mat-card-header>
        <mat-card-title class="caption">
          <mat-icon color="warn">report</mat-icon>
          Critical Error
        </mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p>{{errorMessage}}</p>
      </mat-card-content>
    </mat-card>
  </div>
}
